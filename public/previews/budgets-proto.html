<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgets Overview — Proto</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #171717;
      padding: 24px;
    }
    .proto-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #7c3aed;
      background: #ede9fe;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .frame {
      border: 2px dashed #c4b5fd;
      border-radius: 16px;
      padding: 20px;
      background: #fff;
    }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .hotspot {
      position: relative;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      top: -8px;
      right: 10px;
      font-size: 9px;
      background: #2dd4bf;
      color: #042f2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .strip { display: flex; gap: 10px; }
    .strip .box {
      flex: 1;
      height: 48px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .toggle {
      display: inline-flex;
      gap: 4px;
      margin: 12px 0;
    }
    .toggle span {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: #f5f5f5;
      color: #737373;
    }
    .toggle span.on { background: #111; color: #fff; }
  </style>
</head>
<body>
  <div class="proto-badge">Interactive prototype</div>
  <div class="frame">
    <h1>BudgetsOverview</h1>
    <div class="hotspot" data-label="SummaryStrip">
      <div class="strip">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
    </div>
    <div class="hotspot" data-label="periodToggle">
      <div class="toggle">
        <span>Week</span>
        <span class="on">Month</span>
        <span>Quarter</span>
      </div>
    </div>
    <div class="hotspot" data-label="CategoryList">
      <div style="height:120px;background:#f5f5f5;border-radius:8px;"></div>
    </div>
    <div class="hotspot" data-label="AlertPill" style="margin-bottom:0;">
      <div style="display:inline-block;padding:6px 12px;background:#fff7ed;color:#c2410c;border-radius:999px;font-size:12px;font-weight:500;">
        2 budgets near limit
      </div>
    </div>
  </div>
</body>
</html>
