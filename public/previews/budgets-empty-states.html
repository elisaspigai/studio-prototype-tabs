<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgets Empty States — Proto</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #171717;
      padding: 24px;
    }
    .proto-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #7c3aed;
      background: #ede9fe;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .frame {
      border: 2px dashed #c4b5fd;
      border-radius: 16px;
      padding: 20px;
      background: #fff;
    }
    h1 { font-size: 18px; margin-bottom: 16px; }
    .hotspot {
      position: relative;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .hotspot::after {
      content: attr(data-label);
      position: absolute;
      top: -8px;
      right: 10px;
      font-size: 9px;
      background: #2dd4bf;
      color: #042f2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      padding: 32px 24px;
    }
    .illus {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ede9fe, #ddd6fe);
      border: 2px dashed #c4b5fd;
    }
    .empty h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .empty p {
      font-size: 13px;
      color: #737373;
      line-height: 1.5;
      max-width: 280px;
      margin: 0 auto 20px;
    }
    .cta {
      display: inline-block;
      padding: 10px 18px;
      background: #171717;
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: none;
    }
    .onboarding {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
    }
    .onboarding-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #22c55e;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .onboarding strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .onboarding span { font-size: 12px; color: #525252; line-height: 1.45; }
    .skeleton-strip {
      display: flex;
      gap: 10px;
    }
    .skeleton-strip .sk {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(90deg, #f5f5f5 25%, #ebebeb 50%, #f5f5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .sk-row {
      height: 44px;
      border-radius: 8px;
      background: linear-gradient(90deg, #f5f5f5 25%, #ebebeb 50%, #f5f5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
  </style>
</head>
<body>
  <div class="proto-badge">Interactive prototype</div>
  <div class="frame">
    <h1>BudgetsEmptyStates</h1>
    <div class="hotspot" data-label="zeroBudgets">
      <div class="empty">
        <div class="illus"></div>
        <h2>No budgets yet</h2>
        <p>Create your first budget to track spend by category and get alerts before you hit limits.</p>
        <button class="cta" type="button">Create budget</button>
      </div>
    </div>
    <div class="hotspot" data-label="onboardingTooltip">
      <div class="onboarding">
        <span class="onboarding-dot">1</span>
        <div>
          <strong>Summary strip</strong>
          <span>Total spend, cap, and active alerts appear here once you add budgets.</span>
        </div>
      </div>
    </div>
    <div class="hotspot" data-label="skeletonLoader" style="margin-bottom:0;">
      <div style="font-size:12px;color:#737373;margin-bottom:10px;">Loading state</div>
      <div class="skeleton-strip">
        <div class="sk"></div>
        <div class="sk"></div>
        <div class="sk"></div>
      </div>
      <div class="skeleton-rows">
        <div class="sk-row"></div>
        <div class="sk-row"></div>
        <div class="sk-row"></div>
      </div>
    </div>
  </div>
</body>
</html>
