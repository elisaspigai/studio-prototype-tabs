<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budgets — Kimchi</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      color: #111827;
      padding: 24px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; font-weight: 600; }
    .period-toggle {
      display: inline-flex;
      background: #e5e7eb;
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .period-toggle button {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
    }
    .period-toggle button.active {
      background: #fff;
      color: #111827;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }
    .card-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
    .card-value { font-size: 22px; font-weight: 600; }
    .card-value.teal { color: #0d9488; }
    .card-value.orange { color: #ea580c; }
    .list { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .list-header {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }
    .row:last-child { border-bottom: none; }
    .row-meta { color: #6b7280; font-size: 12px; }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Budgets</h1>
    <div class="period-toggle">
      <button>Week</button>
      <button class="active">Month</button>
      <button>Quarter</button>
    </div>
  </div>
  <div class="summary">
    <div class="card">
      <div class="card-label">Total spend</div>
      <div class="card-value teal">$12,480</div>
    </div>
    <div class="card">
      <div class="card-label">Budget cap</div>
      <div class="card-value">$18,000</div>
    </div>
    <div class="card">
      <div class="card-label">Alerts</div>
      <div class="card-value orange">2 active</div>
    </div>
  </div>
  <div class="list">
    <div class="list-header">Categories</div>
    <div class="row">
      <div>
        <div>Infrastructure</div>
        <div class="row-meta">$4,920 · 82% of cap</div>
      </div>
      <span class="pill">Near limit</span>
    </div>
    <div class="row">
      <div>
        <div>AI agents</div>
        <div class="row-meta">$3,140 · 52% of cap</div>
      </div>
    </div>
    <div class="row">
      <div>
        <div>Design tools</div>
        <div class="row-meta">$1,860 · 31% of cap</div>
      </div>
    </div>
  </div>
</body>
</html>
